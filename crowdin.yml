# Crowdin configuration for the website's English source text (EES-111). Crowdin syncs `master`
# through its GitHub integration (configured in the Crowdin project, not in this repo), the same
# way as the app repo, Shiaulis/Eesti-Ilm.
#
# English is the source language and must not be a target language in the Crowdin project.
# Estonian (et) is the only target.

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true
pull_request_title: "Update translations from Crowdin"
# Crowdin's default commit message ends with [ci skip], which stops GitHub Actions on its
# PRs. A custom message with append_commit_message: false drops the tag, so CI runs.
commit_message: "Update %language% translations of %original_file_name% from Crowdin"
append_commit_message: false

files:
  # UI strings shared by every page: navigation, footer, language switch, 404.
  - source: /src/i18n/en.json
    translation: /src/i18n/%two_letters_code%.json
  # Page text (privacy policy, support, landing): one Markdown file per page. Crowdin can't skip
  # untranslated strings in Markdown, so an Estonian page is exported only once it is fully
  # translated. Until then the Estonian URL shows the English text.
  - source: /src/content/pages/en/*.md
    translation: /src/content/pages/%two_letters_code%/%original_file_name%
    skip_untranslated_files: true
